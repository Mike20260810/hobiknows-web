local_backend: true # <--- 이 줄을 추가합니다.

backend:
  name: github
  repo: Mike20260810/hobiknows-web # 본인의 GitHub 사용자명/저장소명 (예: hobi/hobiknows)
  branch: main # 배포 메인 브랜치
  base_url: https://slinkyauth.vercel.app # 인증 게이트웨이 주소
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "highlight"
    label: "Highlight News"
    folder: "posts/highlight"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["GLOBAL ECONOMY", "TRADE", "AI", "WORLD", "MARKETS", "TECHNOLOGY", "POLICY"] }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }